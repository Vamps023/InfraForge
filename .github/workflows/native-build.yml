name: Native build

on:
  push:
    branches: [main]
  pull_request:

env:
  VCPKG_DISABLE_METRICS: 1

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned vcpkg registry
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: .vcpkg
      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/.vcpkg/scripts/buildsystems/vcpkg.cmake -DINFRAFORGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Tests
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Protocol and persistence self-check (Windows)
        if: runner.os == 'Windows'
        run: .\build\engine\Release\infraforge-engine.exe --self-check
      - name: Protocol and persistence self-check (Linux)
        if: runner.os == 'Linux'
        run: ./build/engine/infraforge-engine --self-check
      - name: Setup Node for engine protocol smoke
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install tool workspaces
        run: npm install
      - name: Generate TypeScript protocol bindings
        run: npm run proto:generate:ts
      - name: Engine protocol smoke (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          INFRAFORGE_ENGINE_PATH: ${{ github.workspace }}/build/engine/Release/infraforge-engine.exe
        run: npm run verify:engine
      - name: Engine protocol smoke (Linux)
        if: runner.os == 'Linux'
        env:
          INFRAFORGE_ENGINE_PATH: ${{ github.workspace }}/build/engine/infraforge-engine
        run: npm run verify:engine
