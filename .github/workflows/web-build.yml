name: Web and desktop build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install exact direct dependencies
        run: npm install
      - name: Lint protocol schemas
        run: npm run proto:lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend and desktop
        run: npm run build:web
