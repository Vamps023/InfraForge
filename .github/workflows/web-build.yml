name: Web and desktop build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install exact direct dependencies
        run: npm install
      - name: Lint protocol schemas
        run: npm run proto:lint
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Desktop supervisor lifecycle tests
        run: npm --workspace @infraforge/desktop run test
      - name: Upload TypeScript diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: typescript-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 7
      - name: Build frontend and desktop
        run: npm run build:web
