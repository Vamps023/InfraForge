syntax = "proto3";

package infraforge.protocol.v1;

import "infraforge/protocol/v1/project.proto";

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message ClientHello {
  ProtocolVersion protocol = 1;
  string session_token = 2;
  string client_name = 3;
  string client_version = 4;
}

message ServerHello {
  ProtocolVersion protocol = 1;
  string engine_version = 2;
  string session_id = 3;
}

message Ping {
  uint64 monotonic_millis = 1;
}

message Pong {
  uint64 monotonic_millis = 1;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_AUTHENTICATION_FAILED = 1;
  ERROR_CODE_PROTOCOL_MISMATCH = 2;
  ERROR_CODE_MALFORMED_FRAME = 3;
  ERROR_CODE_UNSUPPORTED_MESSAGE = 4;
  ERROR_CODE_INTERNAL = 5;
}

message ErrorFrame {
  ErrorCode code = 1;
  string message = 2;
}

message Frame {
  string request_id = 1;

  oneof payload {
    ClientHello client_hello = 10;
    ServerHello server_hello = 11;
    Ping ping = 12;
    Pong pong = 13;
    ErrorFrame error = 14;
    CommandEnvelope command = 15;
    ResultEnvelope result = 16;
    EventEnvelope event = 17;
  }
}
