syntax = "proto3";

package infraforge.protocol.v1;

import "infraforge/protocol/v1/geo.proto";
import "infraforge/protocol/v1/terrain.proto";
import "infraforge/protocol/v1/road.proto";

// Project lifecycle contract: canonical create/open/save-as/save/close queries
// executed by the native engine against the project database.
//
// Protocol 1.4: terrain domain additions. The generic job lifecycle types
// (JobState, JobQueuedEvent, JobStartedEvent, JobProgressEvent,
// JobCompletedEvent, JobFailedEvent, JobCancelledEvent) were introduced in
// protocol 1.3 (Issue #5) and remain authoritative here. Protocol 1.4 adds
// the background-job query/cancel contract (JobRecord, JobCancelCommand,
// JobListCommand) and terrain-specific commands/results/events.

enum TrafficSide {
  TRAFFIC_SIDE_UNSPECIFIED = 0;
  TRAFFIC_SIDE_LEFT = 1;
  TRAFFIC_SIDE_RIGHT = 2;
}

// Projection of the canonical open-project session state. The frontend never
// owns the mutable project object; summaries and events are projections.
message ProjectSummary {
  string project_uuid = 1;
  string display_name = 2;
  string directory = 3;
  uint64 revision = 4;
  bool dirty = 5;
  GeoreferenceConfig georeference = 6;
  TrafficSide traffic_side = 7;
  string created_at = 8;
  string modified_at = 9;
}

message CreateProjectCommand {
  string display_name = 1;
  // Absolute existing parent directory; the engine creates
  // <parent>/<display_name>.iforge and refuses to overwrite.
  string parent_directory = 2;
  GeoreferenceConfig georeference = 3;
  TrafficSide traffic_side = 4;
}

message OpenProjectCommand {
  // Absolute path to an existing <name>.iforge project directory.
  string project_directory = 1;
}

message SaveProjectCommand {}

message SaveProjectAsCommand {
  string display_name = 1;
  // Absolute existing parent directory for the new project directory. The
  // target must not exist; the currently open project is left untouched on
  // failure.
  string parent_directory = 2;
}

message CloseProjectCommand {}

message GetProjectSummaryCommand {}

// Successful lifecycle result carrying the post-command project projection.
message ProjectStateResult {
  ProjectSummary summary = 1;
}

message ProjectClosedResult {
  string project_uuid = 1;
}

enum CommandErrorCode {
  COMMAND_ERROR_CODE_UNSPECIFIED = 0;
  COMMAND_ERROR_CODE_INVALID_ARGUMENT = 1;
  COMMAND_ERROR_CODE_PROJECT_NOT_OPEN = 2;
  COMMAND_ERROR_CODE_PROJECT_ALREADY_OPEN = 3;
  COMMAND_ERROR_CODE_PROJECT_DIRECTORY_INVALID = 4;
  COMMAND_ERROR_CODE_PROJECT_FORMAT_UNSUPPORTED = 5;
  COMMAND_ERROR_CODE_SCHEMA_VERSION_UNSUPPORTED = 6;
  COMMAND_ERROR_CODE_PERSISTENCE_FAILURE = 7;
  COMMAND_ERROR_CODE_INTERNAL = 8;
  // A georeference or coordinate transform request is well-formed but not
  // supported by the canonical geospatial engine (unsupported CRS kind,
  // unavailable vertical transform, unsupported unit).
  COMMAND_ERROR_CODE_GEO_UNSUPPORTED = 9;
  // A terrain request is well-formed but the raster source, storage, or
  // derived tile work cannot be performed as asked (missing/unsupported
  // raster configuration, corrupt source, missing project-owned storage).
  COMMAND_ERROR_CODE_TERRAIN_UNSUPPORTED = 10;
  // A referenced entity (e.g. a job or terrain dataset) does not exist.
  COMMAND_ERROR_CODE_NOT_FOUND = 11;
}

message CommandError {
  CommandErrorCode code = 1;
  string message = 2;
  // Current canonical revision when the failure relates to project state.
  optional uint64 current_revision = 3;
}

message ProjectOpenedEvent {
  ProjectSummary summary = 1;
}

message ProjectClosedEvent {
  string project_uuid = 1;
}

message ProjectRevisionChangedEvent {
  uint64 revision = 1;
}

message ProjectDirtyStateChangedEvent {
  bool dirty = 1;
  uint64 revision = 2;
}

// Job lifecycle events (docs/03_PROTOCOL/EVENTS.md). Jobs represent real
// backend operations executed by the application executor. The lifecycle is:
// queued -> started -> (progress*) -> completed | failed | cancelled.
// Terminal events are emitted exactly once. Progress fields are optional so
// that a legitimate 0 value is distinct from "not supplied".

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_COMPLETED = 3;
  JOB_STATE_FAILED = 4;
  JOB_STATE_CANCELLED = 5;
}

message JobQueuedEvent {
  string job_id = 1;
  // Logical operation name, e.g. "project.create", "geo.set_georeference".
  string operation = 2;
  // Human-readable label for the operation.
  string label = 3;
  // Canonical object ID the operation targets, when applicable.
  string target_id = 4;
  // Whether the backend supports cancelling this job. True for long-running
  // background jobs (e.g. terrain import); false for synchronous commands.
  bool cancellable = 5;
}

message JobStartedEvent {
  string job_id = 1;
}

message JobProgressEvent {
  string job_id = 1;
  // Progress in [0,1] when available. Absent means indeterminate progress.
  optional double progress = 2;
  // Processed work units when available. uint64 preserved as bigint in TS.
  optional uint64 processed = 3;
  // Total work units when available. uint64 preserved as bigint in TS.
  optional uint64 total = 4;
  // Optional human-readable status message.
  string message = 5;
}

message JobCompletedEvent {
  string job_id = 1;
}

message JobFailedEvent {
  string job_id = 1;
  // Stable error code string (maps to CommandErrorCode name).
  string error_code = 2;
  string error_message = 3;
}

message JobCancelledEvent {
  string job_id = 1;
}

// Generic background-job query/cancel contract (protocol 1.4). Long-running
// operations (e.g. terrain import) return a JobStartedResult immediately
// and are tracked through the job lifecycle events above. The frontend
// Operations surface projects job.list and job.cancel for real long jobs.

// Snapshot of a job's current state for job.list queries.
message JobRecord {
  string job_id = 1;
  // Logical operation name, e.g. "terrain.import".
  string operation = 2;
  JobState state = 3;
  // Progress in [0,1] when available. Absent means indeterminate progress.
  optional double progress = 4;
  // Processed work units when available. uint64 preserved as bigint in TS.
  optional uint64 processed = 5;
  // Total work units when available. uint64 preserved as bigint in TS.
  optional uint64 total = 6;
  // Human-readable label / status message.
  string label = 7;
  // Failure detail when state is FAILED; empty otherwise.
  string message = 8;
  string created_at = 9;
  // Whether the backend supports cancelling this job.
  bool cancellable = 10;
}

// Result of a command that starts a background job. The command's
// request lifecycle completes immediately; the long operation is tracked
// through job lifecycle events and job.list.
message JobStartedResult {
  string job_id = 1;
}

message JobCancelCommand {
  string job_id = 1;
}

message JobCancelResult {
  string job_id = 1;
  // False when the job had already finished and could not be cancelled.
  bool cancelled = 2;
}

message JobListCommand {}

message JobListResult {
  repeated JobRecord jobs = 1;
}

// Diagnostic lifecycle events (docs/03_PROTOCOL/EVENTS.md). Diagnostics
// represent real backend-observed conditions. Lifecycle: added -> removed
// | cleared. A diagnostic is identified by a stable ID within a source scope.
// Resolved diagnostics are removed via diagnostic.removed or diagnostic.cleared
// so they do not remain forever.

enum DiagnosticSeverity {
  DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
  DIAGNOSTIC_SEVERITY_INFO = 1;
  DIAGNOSTIC_SEVERITY_WARNING = 2;
  DIAGNOSTIC_SEVERITY_ERROR = 3;
}

message DiagnosticAddedEvent {
  string diagnostic_id = 1;
  string source = 2;
  DiagnosticSeverity severity = 3;
  string message = 4;
  // Canonical object ID the diagnostic targets, when available.
  string target_id = 5;
}

message DiagnosticRemovedEvent {
  string diagnostic_id = 1;
}

message DiagnosticClearedEvent {
  // When non-empty, only diagnostics from this source are cleared.
  // When empty, all diagnostics are cleared (e.g. project closed).
  string source = 1;
}

message CommandEnvelope {
  oneof command {
    CreateProjectCommand create_project = 1;
    OpenProjectCommand open_project = 2;
    SaveProjectCommand save_project = 3;
    SaveProjectAsCommand save_project_as = 4;
    CloseProjectCommand close_project = 5;
    GetProjectSummaryCommand get_project_summary = 6;
    GetGeoreferenceCommand get_georeference = 7;
    SetGeoreferenceCommand set_georeference = 8;
    TransformToProjectGlobalCommand transform_to_project_global = 9;
    // Protocol 1.4 terrain + background-job query/cancel commands.
    TerrainProbeSourceCommand terrain_probe_source = 10;
    TerrainImportDatasetCommand terrain_import_dataset = 11;
    TerrainListDatasetsCommand terrain_list_datasets = 12;
    TerrainGetDatasetCommand terrain_get_dataset = 13;
    TerrainSampleCommand terrain_sample = 14;
    TerrainRegenerateTilesCommand terrain_regenerate_tiles = 15;
    TerrainGetSceneCommand terrain_get_scene = 16;
    JobCancelCommand job_cancel = 17;
    JobListCommand job_list = 18;
    // Protocol 1.4 terrain download area commands.
    TerrainListSourcesCommand terrain_list_sources = 19;
    TerrainPlanDownloadCommand terrain_plan_download = 20;
    TerrainDownloadSelectedCommand terrain_download_selected = 21;
    // Protocol 1.5 road authoring commands.
    CreateRoadCommand create_road = 22;
    DeleteRoadCommand delete_road = 23;
    RenameRoadCommand rename_road = 24;
    InsertRoadControlCommand insert_road_control = 25;
    MoveRoadControlCommand move_road_control = 26;
    DeleteRoadControlCommand delete_road_control = 27;
    FitRoadSourceCommand fit_road_source = 28;
    UpdateRoadElevationCommand update_road_elevation = 29;
    UpdateRoadSuperelevationCommand update_road_superelevation = 30;
    UndoRoadCommand undo_road = 31;
    RedoRoadCommand redo_road = 32;
    ListRoadsCommand list_roads = 33;
    GetRoadCommand get_road = 34;
    GetRoadSceneCommand get_road_scene = 35;
  }
}

message ResultEnvelope {
  oneof outcome {
    ProjectStateResult project_state = 1;
    ProjectClosedResult project_closed = 2;
    CommandError error = 3;
    GeoreferenceStateResult georeference_state = 4;
    TransformToProjectGlobalResult transform_to_project_global = 5;
    // Protocol 1.4 terrain + background-job results.
    TerrainProbeSourceResult terrain_probe_source_result = 6;
    JobStartedResult job_started = 7;
    TerrainListDatasetsResult terrain_list_datasets_result = 8;
    TerrainGetDatasetResult terrain_get_dataset_result = 9;
    TerrainSampleResult terrain_sample_result = 10;
    JobCancelResult job_cancel_result = 11;
    JobListResult job_list_result = 12;
    TerrainSceneResult terrain_scene_result = 13;
    // Protocol 1.4 terrain download area results.
    TerrainListSourcesResult terrain_list_sources_result = 14;
    TerrainPlanDownloadResult terrain_plan_download_result = 15;
    // Protocol 1.5 road authoring results.
    CreateRoadResult create_road_result = 16;
    DeleteRoadResult delete_road_result = 17;
    RenameRoadResult rename_road_result = 18;
    InsertRoadControlResult insert_road_control_result = 19;
    MoveRoadControlResult move_road_control_result = 20;
    DeleteRoadControlResult delete_road_control_result = 21;
    FitRoadSourceResult fit_road_source_result = 22;
    UpdateRoadElevationResult update_road_elevation_result = 23;
    UpdateRoadSuperelevationResult update_road_superelevation_result = 24;
    UndoRoadResult undo_road_result = 25;
    RedoRoadResult redo_road_result = 26;
    ListRoadsResult list_roads_result = 27;
    GetRoadResult get_road_result = 28;
    RoadSceneResult road_scene_result = 29;
  }
}

message EventEnvelope {
  string event_id = 1;
  oneof event {
    ProjectOpenedEvent project_opened = 2;
    ProjectClosedEvent project_closed = 3;
    ProjectRevisionChangedEvent project_revision_changed = 4;
    ProjectDirtyStateChangedEvent project_dirty_state_changed = 5;
    GeoreferenceChangedEvent georeference_changed = 6;
    JobQueuedEvent job_queued = 7;
    JobStartedEvent job_started = 8;
    JobProgressEvent job_progress = 9;
    JobCompletedEvent job_completed = 10;
    JobFailedEvent job_failed = 11;
    JobCancelledEvent job_cancelled = 12;
    DiagnosticAddedEvent diagnostic_added = 13;
    DiagnosticRemovedEvent diagnostic_removed = 14;
    DiagnosticClearedEvent diagnostic_cleared = 15;
    // Protocol 1.4 terrain event.
    TerrainDatasetAddedEvent terrain_dataset_added = 16;
    // Protocol 1.5 road events.
    RoadCreatedEvent road_created = 17;
    RoadUpdatedEvent road_updated = 18;
    RoadRemovedEvent road_removed = 19;
    RoadGeometryChangedEvent road_geometry_changed = 20;
  }
}
