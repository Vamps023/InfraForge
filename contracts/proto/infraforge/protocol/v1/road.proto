syntax = "proto3";

package infraforge.protocol.v1;

// Road domain contract: canonical mathematical alignment authoring,
// editing, fitting, and projection. The frontend receives projections
// (summaries, inspector details) and events only — never canonical
// geometry payloads or render meshes.
//
// Road canonical state (RoadId, ReferenceAlignment, profiles, source,
// protected anchors) is owned by the engine and persisted to SQLite.
// Derived tessellation/mesh data is never canonical and is regenerated
// from the mathematical alignment.

// ---- Projections ----

// Lightweight road summary for the outliner and road list.
message RoadSummary {
  string road_id = 1;
  string name = 2;
  double length = 3;
  uint32 alignment_segment_count = 4;
  string source_provider = 5;
  string source_id = 6;
  uint32 protected_anchor_count = 7;
  uint64 revision = 8;
}

// One alignment segment in a road projection.
message RoadAlignmentSegmentInfo {
  string kind = 1;  // "line", "arc", "clothoid"
  double start_station = 2;
  double length = 3;
  double start_curvature = 4;
  double end_curvature = 5;
}

// Exact canonical breakpoint projected for profile inspection and editing.
// Value is project height for elevation and radians for superelevation.
message RoadProfileBreakpoint {
  double station = 1;
  double value = 2;
}

message RoadWidthBreakpoint {
  double station = 1;
  double left_width = 2;
  double right_width = 3;
}

// Detailed road projection for the inspector.
message RoadDetails {
  string road_id = 1;
  string name = 2;
  double length = 3;
  uint32 alignment_segment_count = 4;
  repeated RoadAlignmentSegmentInfo alignment_segments = 5;
  bool has_elevation_profile = 6;
  uint32 elevation_breakpoint_count = 7;
  bool has_superelevation_profile = 8;
  uint32 superelevation_breakpoint_count = 9;
  string source_provider = 10;
  string source_id = 11;
  string source_crs = 12;
  uint32 protected_anchor_count = 13;
  bool is_valid = 14;
  repeated RoadDiagnostic diagnostics = 15;
  uint64 revision = 16;
  repeated RoadControlPoint control_points = 17;
  double position_tolerance = 18;
  optional double max_curvature = 19;
  repeated RoadProfileBreakpoint elevation_breakpoints = 20;
  repeated RoadProfileBreakpoint superelevation_breakpoints = 21;
  repeated RoadWidthBreakpoint width_breakpoints = 22;
}

// Editable fitting control projected for the inspector. This is not the
// immutable source evidence and does not make the frontend authoritative.
message RoadControlPoint {
  double easting = 1;
  double northing = 2;
  optional double elevation = 3;
  bool protected_anchor = 4;
}

// Road diagnostic projection.
message RoadDiagnostic {
  string code = 1;
  string message = 2;
  string severity = 3;
}

// ---- Commands ----

// Create a new road from a source polyline. The engine runs the shared
// deterministic fitter to produce a canonical ReferenceAlignment.
message CreateRoadCommand {
  string name = 1;
  // Source polyline vertices in canonical project coordinates.
  repeated double source_eastings = 2;
  repeated double source_northings = 3;
  // Optional elevations (same length as eastings; empty means absent).
  repeated double source_elevations = 4;
  // Position tolerance for the fit (canonical project units).
  double position_tolerance = 5;
  // Optional maximum curvature constraint.
  optional double max_curvature = 6;
  // Protected anchor station indices (0-based into the source polyline).
  repeated uint32 protected_anchor_indices = 7;
}

// Delete a road by ID.
message DeleteRoadCommand {
  string road_id = 1;
}

// Rename a road.
message RenameRoadCommand {
  string road_id = 1;
  string name = 2;
}

// Insert a control point into a road's source polyline and refit.
message InsertRoadControlCommand {
  string road_id = 1;
  // Index in the source polyline to insert before (0-based).
  uint32 insert_before_index = 2;
  double easting = 3;
  double northing = 4;
  optional double elevation = 5;
}

// Move a control point in a road's source polyline and refit.
message MoveRoadControlCommand {
  string road_id = 1;
  // Index of the control point to move (0-based).
  uint32 control_index = 2;
  double easting = 3;
  double northing = 4;
  optional double elevation = 5;
}

// Delete a control point from a road's source polyline and refit.
message DeleteRoadControlCommand {
  string road_id = 1;
  // Index of the control point to delete (0-based).
  uint32 control_index = 2;
}

// Fit/refit a road from its source polyline with new parameters.
message FitRoadSourceCommand {
  string road_id = 1;
  // Omitted for a normal refit, which reuses the persisted fitting contract.
  // Present only when the user explicitly changes the fitting settings.
  optional double position_tolerance = 2;
  optional double max_curvature = 3;
  // Explicitly replaces the persisted max-curvature constraint with no
  // constraint. Omission preserves the existing constraint. This is kept
  // distinct from optional-field presence so all three operations are
  // representable: preserve, replace, and clear.
  bool clear_max_curvature = 4;
}

// Update the elevation profile of a road.
message UpdateRoadElevationCommand {
  string road_id = 1;
  repeated double stations = 2;
  repeated double elevations = 3;
}

// Update the superelevation profile of a road.
message UpdateRoadSuperelevationCommand {
  string road_id = 1;
  repeated double stations = 2;
  repeated double superelevations = 3;
}

message UpdateRoadWidthCommand {
  string road_id = 1;
  repeated double stations = 2;
  repeated double left_widths = 3;
  repeated double right_widths = 4;
}

// Rebuild the canonical elevation profile by sampling terrain along the
// canonical alignment. An empty dataset_id uses TerrainService's deterministic
// most-recent-covering-dataset rule.
message ConformRoadToTerrainCommand {
  string road_id = 1;
  string dataset_id = 2;
  double station_interval = 3;
  double vertical_offset = 4;
}

// Undo the last road command.
message UndoRoadCommand {
  // If empty, undoes the last command of any road.
  string road_id = 1;
}

// Redo the last undone road command.
message RedoRoadCommand {
  string road_id = 1;
}

// List all roads in the project.
message ListRoadsCommand {}

// Get detailed information about a specific road.
message GetRoadCommand {
  string road_id = 1;
}

// ---- Results ----

message CreateRoadResult {
  RoadSummary road = 1;
}

message DeleteRoadResult {
  // Empty on success.
}

message RenameRoadResult {
  RoadSummary road = 1;
}

message InsertRoadControlResult {
  RoadSummary road = 1;
}

message MoveRoadControlResult {
  RoadSummary road = 1;
}

message DeleteRoadControlResult {
  RoadSummary road = 1;
}

message FitRoadSourceResult {
  RoadSummary road = 1;
}

message UpdateRoadElevationResult {
  RoadSummary road = 1;
}

message UpdateRoadSuperelevationResult {
  RoadSummary road = 1;
}

message UpdateRoadWidthResult {
  RoadSummary road = 1;
}

message ConformRoadToTerrainResult {
  RoadSummary road = 1;
}

message UndoRoadResult {
  RoadSummary road = 1;
  string road_id = 2;
  bool exists_after_operation = 3;
}

message RedoRoadResult {
  RoadSummary road = 1;
  string road_id = 2;
  bool exists_after_operation = 3;
}

message ListRoadsResult {
  repeated RoadSummary roads = 1;
}

message GetRoadResult {
  RoadDetails road = 1;
  // Canonical outliner/list projection for the same record as road.
  RoadSummary summary = 2;
}

// ---- Road Scene Projection (for viewport rendering) ----

// One vertex of a road scene mesh, in render-local float coordinates.
message RoadSceneVertex {
  float x = 1;
  float y = 2;
  float z = 3;
  float nx = 4;
  float ny = 5;
  float nz = 6;
}

// One road mesh for the viewport: a triangle list with vertices and indices.
message RoadSceneMesh {
  string road_id = 1;
  repeated RoadSceneVertex vertices = 2;
  repeated uint32 indices = 3;
  int64 chunk_x = 4;
  int64 chunk_y = 5;
}

// Road scene projection: all road meshes for the viewport, in render-local
// coordinates relative to the scene origin.
message RoadSceneResult {
  double origin_easting = 1;
  double origin_northing = 2;
  double origin_height = 3;
  repeated RoadSceneMesh meshes = 4;
  uint64 revision = 5;
}

// Get the road scene projection for the viewport.
message GetRoadSceneCommand {}

// ---- Events ----

// Emitted when a road is created.
message RoadCreatedEvent {
  string road_id = 1;
  string name = 2;
  uint64 revision = 3;
}

// Emitted when a road is updated (geometry, profile, or name change).
message RoadUpdatedEvent {
  string road_id = 1;
  uint64 revision = 2;
}

// Emitted when a road is deleted.
message RoadRemovedEvent {
  string road_id = 1;
  uint64 revision = 2;
}

// Emitted when road geometry changes (refit, control point edit).
message RoadGeometryChangedEvent {
  string road_id = 1;
  uint64 revision = 2;
  // Affected world chunk coordinates.
  repeated int64 chunk_x = 3;
  repeated int64 chunk_y = 4;
}
